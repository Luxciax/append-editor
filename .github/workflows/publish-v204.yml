name: publish-append-editor-rich-v204

permissions:
  contents: write

on:
  push:
    branches:
      - main

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-v204]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines
      - name: Production build
        env:
          CI: 'false'
        run: yarn build
      - name: Package release
        run: |
          cd build
          zip -qr ../append-editor-rich-v2.0.4.zip .
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.0.4 append-editor-rich-v2.0.4.zip             --title "Append Editor Rich v2.0.4"             --notes "Android/mobile compatibility release: adds Android WebView viewport/virtual-keyboard support, 44px touch targets, single-row horizontally scrollable mobile toolbars, disables selection bubble overlays on touch devices, makes tables/code/media mobile-scrollable, keeps slash/find panels within the visible viewport, adds safe-area spacing, and adapts the Standard Notes shell/menu to dynamic viewport height."

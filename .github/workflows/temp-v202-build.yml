name: temporary-v202-build-check

permissions:
  contents: write

on:
  push:
    branches:
      - main

jobs:
  build:
    if: contains(github.event.head_commit.message, '[build-v202]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
      - name: Install dependencies and refresh lockfile
        run: yarn install --ignore-engines
      - name: Persist lockfile if changed
        run: |
          if ! git diff --quiet -- yarn.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add yarn.lock
            git commit -m "chore: refresh lockfile after ProseMirror dedupe"
            git push
          fi
      - name: Production build
        env:
          CI: 'false'
        run: yarn build

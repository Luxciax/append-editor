name: temporary-rich-editor-build-check
# explicit validation marker

on:
  push:
    branches:
      - main

jobs:
  build:
    if: contains(github.event.head_commit.message, '[build-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
      - name: Install Yarn 1
        run: npm install --global yarn@1.22.22
      - name: Install dependencies
        run: yarn install --ignore-engines
      - name: Production build
        env:
          CI: 'false'
        run: yarn build

name: temporary-rich-editor-build-check

permissions:
  contents: write

on:
  push:
    branches:
      - main

jobs:
  build:
    if: contains(github.event.head_commit.message, '[build-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
      - name: Install Yarn 1
        run: npm install --global yarn@1.22.22
      - name: Install dependencies
        run: yarn install --ignore-engines
      - name: Refresh lockfile on main when needed
        run: |
          if ! git diff --quiet -- yarn.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add yarn.lock
            git commit -m "chore: refresh yarn lockfile"
            git push
          fi
      - name: Production build
        env:
          CI: 'false'
        run: yarn build
